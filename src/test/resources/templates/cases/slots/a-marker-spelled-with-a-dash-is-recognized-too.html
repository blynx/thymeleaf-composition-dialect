<!--
  CASE      The component's own template spells its marker <c-slot /> (dash form) rather than <c:slot />.
            Recognizing the marker by identity rather than a raw string compare — the same way the
            call-site c:slot and data-c-slot attribute already both work — picks this up as a side
            effect, not a feature that needed its own support.
  EXPECT    the given content lands inside; no leftover "c-slot" text anywhere
-->
<c:dash-spelled-slot>given</c:dash-spelled-slot>
